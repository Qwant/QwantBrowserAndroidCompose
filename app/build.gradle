plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin)
    alias(libs.plugins.hilt)
    alias(libs.plugins.protobuf)
    alias(libs.plugins.ksp)
    id 'kotlin-kapt'
}

// TODO make piwik optional for build
def piwikProdSettingsFile = rootProject.file("piwik.prod.properties")
def piwikProdSettings = new Properties()
piwikProdSettings.load(new FileInputStream(piwikProdSettingsFile))

def piwikDevSettingsFile = rootProject.file("piwik.dev.properties")
def piwikDevSettings = new Properties()
piwikDevSettings.load(new FileInputStream(piwikDevSettingsFile))

android {
    namespace 'com.qwant.android.qwantbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.qwant.liberty"
        minSdk 21
        targetSdk 34
        versionCode 50100000
        versionName "5.1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }

        resourceConfigurations += ["en", "fr", "de", "es", "it"]
    }

    bundle {
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
        language {
            enableSplit = false
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        debug {
            getIsDefault().set(true)
            applicationIdSuffix ".debug"
            buildConfigField("String", "PIWIK_URL", piwikDevSettings['PIWIK_URL'])
            buildConfigField("String", "PIWIK_SITE_ID", piwikDevSettings['PIWIK_SITE_ID'])
            buildConfigField("String", "COMPANION_ID", '"' + rootProject.ext.companion_id + '"')
        }
        internal {
            initWith(debug)
            applicationIdSuffix ".internal"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "PIWIK_URL", piwikProdSettings['PIWIK_URL'])
            buildConfigField("String", "PIWIK_SITE_ID", piwikProdSettings['PIWIK_SITE_ID'])
            buildConfigField("String", "COMPANION_ID", '"' + rootProject.ext.companion_id + '"')
        }
    }

    flavorDimensions += "target"
    productFlavors {
        playstore {
            getIsDefault().set(true)
            dimension "target"
        }
        sfr {
            dimension "target"
            versionCode = 100000 + (android.defaultConfig.versionCode ?: 0)
        }
        genymobile {
            dimension "target"
        }
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all-compatibility', '-opt-in=kotlin.RequiresOptIn']
    }
    kotlin {
        jvmToolchain(17)
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.11'
    }
    hilt {
        enableAggregatingTask = true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    // To include every files in the assets folder (and not ignore VIP)
    aaptOptions {
        ignoreAssetsPattern  '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

