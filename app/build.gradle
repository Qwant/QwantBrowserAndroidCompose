android {
    namespace 'com.qwant.android.qwantbrowser'
    compileSdk 35
    defaultConfig {
        applicationId "com.qwant.liberty"
        minSdk 21
        targetSdk 35
        versionCode 50103050
        versionName "5.1.3.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }

        resourceConfigurations += ["en", "fr", "de", "es", "it"]
    }

    bundle {
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
        language {
            enableSplit = false
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
            universalApk true
        }
    }

    buildTypes {
        debug {
            getIsDefault().set(true)
            applicationIdSuffix ".debug"
            buildConfigField("String", "PIWIK_URL", "\"https://k.qwant.com\"")
            buildConfigField("String", "COMPANION_ID", '"' + rootProject.ext.companion_id + '"')
        }
        /* internal {
            initWith(debug)
            applicationIdSuffix ".internal"
            buildConfigField("String", "QWANT_BASE_URL", '"https://front-qwant20.int-front.int.ovh.kube.qwant.ninja"')
            buildConfigField("String", "QWANT_API_BASE_URL", '"https://api-qwant2024.int-api.int.ovh.kube.qwant.ninja/v3"')
        } */
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "PIWIK_URL", "\"https://k.qwant.com\"")
            buildConfigField("String", "COMPANION_ID", '"' + rootProject.ext.companion_id + '"')
        }
    }

    flavorDimensions += ["version", "target"]
    productFlavors {
        def addConstantTo = {target, constantName, constantValue ->
            target.manifestPlaceholders += [ (constantName):constantValue ]
            target.buildConfigField "String", "${constantName}", "\"${constantValue}\""
        }
        original {
            dimension "version"
            getIsDefault().set(true)
            buildConfigField("String", "QWANT_BASE_URL", '"https://www.qwant.com"')
            buildConfigField("String", "QWANT_API_BASE_URL", '"https://api.qwant.com/v3"')
            buildConfigField("boolean", "PIWIK_ANONYMISATION", "false")
            addConstantTo(owner, "WIDGET_ACTION", "com.qwant.android.intent.action.WIDGET")
        }
        junior {
            dimension "version"
            applicationId "com.qwantjunior.mobile"
            buildConfigField("String", "QWANT_BASE_URL", '"https://www.qwantjunior.com"')
            buildConfigField("String", "QWANT_API_BASE_URL", '"https://api.qwant.com/v3/egp/search"')
            buildConfigField("boolean", "PIWIK_ANONYMISATION", "true")
            addConstantTo(owner, "WIDGET_ACTION", "com.qwant.android.intent.action.WIDGET_JUNIOR")
        }

        playstore {
            getIsDefault().set(true)
            dimension "target"
        }
        sfr {
            dimension "target"
            versionCode = 100000 + (android.defaultConfig.versionCode ?: 0)
        }
        genymobile {
            dimension "target"
        }
        canaltoys {
            dimension "target"
        }
        logicom {
            dimension "target"
        }
        orange {
            dimension "target"
            ndk.abiFilters.clear()
            //noinspection ChromeOsAbiSupport
            ndk.abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all-compatibility', '-opt-in=kotlin.RequiresOptIn']
    }
    kotlin {
        jvmToolchain(17)
    }
    hilt {
        enableAggregatingTask = true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    // To include every files in the assets folder (and not ignore VIP)
    aaptOptions {
        ignoreAssetsPattern  '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    applicationVariants.configureEach { variant ->
        if (variant.productFlavors[0].name == "junior") {
            if (variant.buildType.name == "debug") {
                variant.buildConfigField("String", "PIWIK_SITE_ID", '"c3460f4f-3ac3-4155-b879-3933f63e733c"')
            } else {
                variant.buildConfigField("String", "PIWIK_SITE_ID", '"88e1f87c-f37d-4eb9-abb6-7c2954cfe4d2"')
            }
        } else {
            if (variant.buildType.name == "debug") {
                variant.buildConfigField("String", "PIWIK_SITE_ID", '"9d3ebf38-ba38-4d72-9847-d412b59ebcd6"')
            } else {
                variant.buildConfigField("String", "PIWIK_SITE_ID", '"8904633f-a958-45ca-b540-df5248159519"')
            }
        }
    }
}


