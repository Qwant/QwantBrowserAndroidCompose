# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Android.gitlab-ci.yml

# Read more about this script on this blog post https://about.gitlab.com/2018/10/24/setting-up-gitlab-ci-for-android-projects/, by Jason Lenny
# If you are interested in using Android with FastLane for publishing take a look at the Android-Fastlane template.

stages:
  - build
  - test
  - deploy

image: eclipse-temurin:17-jdk-jammy

variables:

  # develop branch name
  DEVELOP_BRANCH: "ci" # For testing only. Update to dev

  # Proxy - Not necessary on Gitlab OVH
  # GRADLE_OPTS: "-Dhttp.proxyHost=10.100.9.1 -Dhttp.proxyPort=2001 -Dhttps.proxyHost=10.100.9.1 -Dhttps.proxyPort=2001"

  # ANDROID_COMPILE_SDK is the version of Android you're compiling with.
  # It should match compileSdkVersion.
  ANDROID_COMPILE_SDK: "34"

  # ANDROID_BUILD_TOOLS is the version of the Android build tools you are using.
  # It should match buildToolsVersion.
  ANDROID_BUILD_TOOLS: "33.0.2"

  # It's what version of the command line tools we're going to download from the official site.
  # Official Site-> https://developer.android.com/studio/index.html
  # There, look down below at the cli tools only, sdk tools package is of format:
  #        commandlinetools-os_type-ANDROID_SDK_TOOLS_latest.zip
  # when the script was last modified for latest compileSdkVersion, it was which is written down below
  ANDROID_SDK_TOOLS: "9477386"

  # Fastlane variables
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"

# Packages installation before running script
before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes wget unzip

  - gem install bundler
  - bundle install
  
  # Setup path as android_home for moving/exporting the downloaded sdk into it
  - export ANDROID_HOME="${PWD}/android-sdk-root"
  # Create a new directory at specified location
  - install -d $ANDROID_HOME
  # Here we are installing androidSDK tools from official source,
  # (the key thing here is the url from where you are downloading these sdk tool for command line, so please do note this url pattern there and here as well)
  # after that unzipping those tools and
  # then running a series of SDK manager commands to install necessary android SDK packages that'll allow the app to build
  - wget --no-verbose --output-document=$ANDROID_HOME/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
  - unzip -q -d "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/cmdline-tools.zip"
  - mv -T "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/tools"
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin

  # Download gradle
  #- wget --output-document=gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
  #- unzip -q gradle.zip -d ./gradle
  # export GRADLE_HOME=$PWD/.gradle/gradle-8.2
  # export PATH=$GRADLE_HOME/bin:$PATH
  
  # Nothing fancy here, just checking sdkManager version
  - sdkmanager --version

  # use yes to accept all licenses
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}"
  - sdkmanager "platform-tools"
  - sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"

  # Not necessary, but just for surity
  - chmod +x ./gradlew
   
# build project for all features branches (except main and dev) without artifacts to speed up
build:
  interruptible: true
  stage: build
  script:
    - ./gradlew --console=plain --no-configuration-cache --no-build-cache assembleDebug
  rules:
    - if: '$CI_COMMIT_BRANCH != $DEVELOP_BRANCH && $CI_COMMIT_BRANCH != "main"'
      when: always
  # no artifacts needed

# build project for dev branch with artifacts
build_playstore_aab:
  interruptible: true
  stage: build
  script:
    - echo "Building AAB for 'playstore' flavor..."
    - ./gradlew bundlePlaystoreRelease # --console=plain --no-configuration-cache --no-build-cache
    - mv app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab qwant-browser-playstore.aab
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEVELOP_BRANCH'
      when: always
  artifacts:
    paths:
      - qwant-browser-playstore.aab
    expire_in: 10 days

# Run all tests on dev branch, if any fails, interrupt the pipeline
# unit_test:
#  dependencies: 
#    - build_playstore_aab
#  interruptible: true
#  stage: test
#  script:
#    - ./gradlew -Pci --console=plain :app:testPlaystoreDebug

sign_and_upload_to_internal:
  stage: deploy
  dependencies:
    - build_playstore_aab  
  before_script:
    - echo "Setup fastlane"
    - apt-get --quiet update --yes
    - apt-get --quiet install --yes wget unzip

    # Install Ruby and Fastlane
    - apt-get install -qqy --no-install-recommends build-essential ruby-full
    - gem install bundler fastlane
  script:
    # Copy playstore file to the current directory
    - echo "$PLAYSTORE_JSON_BASE64" | base64 -d > fastlane/playstore.json

    # Copy keystore file to the current directory
    - echo "$KEYSTORE_PLAYSTORE" | base64 -d > keystore_playstore.jks

    # Run Fastlane action to sign the AAB
    - echo "Signing AAB..."
    - fastlane android sign_aab bundle:./qwant-browser-playstore.aab keystore_file:./keystore_playstore.jks keystore_password:$KEYSTORE_PLAYSTORE_PASSWORD key_alias:$KEYSTORE_PLAYSTORE_KEY_ALIAS key_password:$KEYSTORE_PLAYSTORE_KEY_PASSWORD

    # Run Fastlane supply with the extracted JSON key
    - echo "Uploading AAB to internal Play Store..."
    - fastlane run supply --aab qwant-browser-playstore-signed.aab --track internal --json_key playstore.json
