mozac-feature-webcompat = { group = "org.mozilla.components", name = "feature-webcompat", version.ref = "mozac" }
mozac-support-utils = { group = "org.mozilla.components", name = "support-utils", version.ref = "mozac" }
mozac-support-ktx = { group = "org.mozilla.components", name = "support-ktx", version.ref = "mozac" }
mozac-support-rusthttp = { group = "org.mozilla.components", name = "support-rusthttp", version.ref = "mozac" }
mozac-support-webextensions = { group = "org.mozilla.components", name = "support-webextensions", version.ref = "mozac" }
mozac-ui-widgets = { group = "org.mozilla.components", name = "ui-widgets", version.ref = "mozac" }
mozac-ui-icons = { group = "org.mozilla.components", name = "ui-icons", version.ref = "mozac" }
# Testing
junit-main = { group = "junit", name = "junit", version.ref = "junit" }
junit-androidx = { group = "androidx.test.ext", name = "junit", version.ref = "junit-androidx" }
